<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slot District Prototype v0.7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee:wght@400&family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;700;800&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./cloverpit_slot_v0.7/styles/main.css">
</head>
<body>
  <main id="wrap">
    <canvas id="fx"></canvas>

    <div class="hdr">
      <div class="logo" aria-label="Slot District">
        <span class="logo-image-slot" aria-hidden="true"></span>
        <span class="logo-badge">SD</span>
        <span class="logo-stack">
          <span class="logo-word logo-word-main" data-text="SLOT">SLOT</span>
          <span class="logo-divider" aria-hidden="true"></span>
          <span class="logo-word logo-word-accent" data-text="DISTRICT">DISTRICT</span>
        </span>
      </div>
      <div class="sub">SPIN TO SURVIVE - DO NOT LOSE</div>
    </div>

    <section class="manager-overlay" id="manageroverlay" aria-label="Alice live dialogue">
      <img
        id="manageroverlayportrait"
        class="manager-overlay-portrait"
        src="./cloverpit_slot_v0.7/assets/images/characters/alice_main.webp"
        alt="Alice, the casino manager AI"
      >
      <div class="manager-overlay-bubble">
        <div class="manager-overlay-title" id="manageroverlaytitle">ALICE</div>
        <div class="manager-overlay-text" id="manageroverlaytext"></div>
        <div class="manager-overlay-choices" id="manageroverlaychoices"></div>
      </div>
    </section>

    <div class="game-layout">
      <aside class="side-stack">
        <section class="manager-panel" id="managerpanel" hidden>
          <div class="manager-hero">
            <img
              id="managerportrait"
              class="manager-portrait"
              src="./cloverpit_slot_v0.7/assets/images/characters/alice_main.webp"
              alt="Alice, the casino manager AI"
            >
            <div class="manager-meta">
              <div class="manager-kicker">CASINO MANAGER AI</div>
              <div class="manager-name" id="managername">ALICE</div>
              <div class="manager-role" id="managerrole">Helpful until your appetite becomes interesting.</div>
            </div>
          </div>
          <div class="manager-bubble">
            <div class="manager-bubble-title" id="managertitle">ALICE</div>
            <div class="manager-bubble-text" id="managertext"></div>
          </div>
          <div class="manager-choices" id="managerchoices"></div>
        </section>

        <div class="item-panel" id="itempanel" hidden></div>

        <div class="symbol-panel">
          <div class="chain-head">
            <span>SYMBOL TABLE</span>
            <span class="chain-sub">live multipliers / weights</span>
          </div>
          <div class="symrow" id="symrow"></div>
          <div class="weight-notes" id="weightnotes"></div>
        </div>

        <div class="chain-panel collapsed" id="chainpanel">
          <button class="chain-toggle" id="bchaintoggle" type="button" aria-expanded="false">
            <span class="chain-title-wrap">CHAIN LOG</span>
            <span class="chain-toggle-state" id="chaintogglestate">OPEN</span>
          </button>
          <div class="chain-log" id="chainlog"></div>
        </div>

        <button class="alice-toggle" id="balice" type="button" aria-expanded="true">
          <span class="alice-toggle-label">ALICE</span>
          <span class="alice-toggle-state" id="alicetogglestate">CLOSE</span>
        </button>
      </aside>

      <section class="main-stack">
        <div class="status-hud">
          <div class="sc coin-sc"><div class="scl">COIN</div><div class="scv" id="vc">120</div></div>

          <div class="cbar" id="cbar">
            <div class="spin-win" id="spinwin">
              <div class="spin-win-label">SPIN WIN</div>
              <div class="spin-win-value" id="spinwinval">+0</div>
            </div>
            <div class="combo-mini">
              <div class="cb-label">COMBO</div>
              <div class="cb-val" id="cb-val">0</div>
              <div class="cb-mult" id="cb-mult"></div>
            </div>
          </div>
        </div>

        <div class="play-row">
          <div class="play-core">
            <div class="machine-wrap">
              <div class="pl-labels" id="paylinelabels"></div>
              <div class="rm" id="rm">
                <div class="pl-lines" id="paylinelines"></div>
                <div class="reels" id="reels"></div>
              </div>
              <button class="lever" id="blever" aria-label="Pull slot lever">
                <span class="lever-arm">
                  <span class="lever-knob"></span>
                </span>
              </button>
            </div>

            <div class="res-panel" id="resultpanel"></div>

            <div class="btns">
              <button class="bspin" id="bspin">SPIN - 5 COINS</button>
              <button class="bs" id="bdeposit">DEPOSIT</button>
              <button class="bs" id="bnext">NEXT >></button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="build">Prototype v0.7 - Chain Evaluation Build</div>
  </main>

  <script type="module" src="./cloverpit_slot_v0.7/js/main.js"></script>
</body>
</html>
