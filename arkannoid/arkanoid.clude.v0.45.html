
<style>

  position:absolute; inset:0; pointer-events:none; z-index:10;

</style>

<div id="gr">
  <div id="title-bar">
    <div class="logo">ARK<span>ANOID</span></div>
    <div style="font-size:10px;color:#ff2d7888;letter-spacing:0.1em;">CYBERPUNK EDITION</div>
  </div>

  </div>

    <canvas id="c" width="540" height="600"></canvas>

      <div id="ov-title" data-text="ARKANOID">ARKANOID</div>
      <div id="ov-sub">마우스 / ←→ 키로 패들 조작<br>파워업 아이템을 수집하세요</div>

    </div>
  </div>
  <div id="pu-bar"></div>
  <div id="hint">MOUSE / ARROW KEYS / SPACE · TOUCH SUPPORTED</div>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d',{alpha:false});
const W=540,H=600;
const COLS=10,ROWS=7,BW=46,BH=16,BP=3;
const BOX=(W-(COLS*(BW+BP)-BP))/2, BOY=60;
const PW=84,PH=10,BR=7;
const BSPD=4.368,SINC=0.4004,MSPD=10.556,LSPD=6; // ball speed +40%, then +30% more
const FRAME_MS=1000/60, MAX_DT=2.5, MAX_PARTICLES=260;
const CYAN='#00f5ff',PINK='#ff2d78',PURPLE='#b048ff',AMBER='#ffb830',GREEN='#39ff14',ORANGE='#ff6b2b';

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;
  };
}


const PALETTES=[
  [CYAN,'#0099aa'],
  [PINK,'#aa1a4a'],
  [PURPLE,'#7a20cc'],
  [AMBER,'#cc8800'],
  [GREEN,'#22bb00'],
  [ORANGE,'#cc4400'],
  ['#ffffff','#aaaacc'],
];

const sfxCtx=(()=>{try{return new(window.AudioContext||window.webkitAudioContext)();}catch(e){}})();
const lastSfx={};
function tone(f,type='square',v=0.05,t=0.1,ft=null){
  if(!sfxCtx)return;

  // sfx() calls this as tone(freq, waveType, volume, duration, targetFreq).
  // Guard values because WebAudio ramp methods throw when value/time is NaN, Infinity, or <= 0.
  const now=sfxCtx.currentTime;
  const freq=Number.isFinite(f)&&f>0?f:440;
  const dur=Number.isFinite(t)&&t>0?t:0.1;
  const vol=Number.isFinite(v)&&v>0?v:0.05;
  const end=now+dur;
  const target=Number.isFinite(ft)&&ft>0?ft:null;

  const o=sfxCtx.createOscillator(),g=sfxCtx.createGain();
  o.connect(g);g.connect(sfxCtx.destination);
  o.type=type;
  o.frequency.setValueAtTime(freq,now);
  if(target!==null)o.frequency.exponentialRampToValueAtTime(target,end);
  g.gain.setValueAtTime(vol,now);
  g.gain.exponentialRampToValueAtTime(0.001,end);
  o.start(now);o.stop(end);
}
function sfx(t,c=0){
  if(!sfxCtx)return;

  // Avoid spawning too many oscillators during clustered brick hits.
  const now=performance.now();
  const minGap=t==='crack'||t==='hit'?28:(t==='pad'?45:0);
  if(minGap&&now-(lastSfx[t]||0)<minGap)return;
  lastSfx[t]=now;

  if(t==='hit'){tone(200+c*30,'square',0.05,0.3,60);tone(800,'sawtooth',0.04,0.12,300);}
  if(t==='crack'){tone(100,'square',0.14,0.4,30);tone(900,'sawtooth',0.06,0.2,150);tone(1800,'sine',0.04,0.08,500);}
  if(t==='pad'){tone(300,'sine',0.07,0.2,180);tone(600,'sine',0.04,0.1,360);}
  if(t==='die'){tone(180,'sawtooth',0.6,0.25,30);}
  if(t==='pu'){tone(440,'sine',0.05,0.15);tone(660,'sine',0.08,0.2);tone(880,'sine',0.12,0.2,1200);}
  if(t==='clear'){tone(523,'sine',0.07,0.2);tone(659,'sine',0.07,0.2);tone(784,'sine',0.14,0.28);tone(1047,'sine',0.12,0.35,1400);}
  if(t==='boss'){tone(80,'sawtooth',0.15,0.3,40);}
}

let particles=[];
function addParticle(p){
  particles.push(p);
  if(particles.length>MAX_PARTICLES)particles.splice(0,particles.length-MAX_PARTICLES);
}
function spawnDestroy(x,y,w,h,col,combo){
  const cx=x+w/2,cy=y+h/2,s=1+Math.min(combo,8)*0.12;
  addParticle({type:'ring',x:cx,y:cy,r:0,mr:30+Math.min(combo,8)*6,life:1,col,decay:0.04});

  // Keep the effect rich, but cap it so a high combo cannot flood the renderer.
  const sh=Math.min(16,7+Math.floor(combo*1.2));
  for(let i=0;i<sh;i++){
    const a=(Math.PI*2/sh)*i+(Math.random()-.5)*.5;
    const sp=(2+Math.random()*3.2)*s;
    addParticle({type:'shard',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      w:3+Math.random()*7,h:2+Math.random()*4,rot:Math.random()*Math.PI*2,
      rv:(Math.random()-.5)*.32,life:1,decay:0.022+Math.random()*0.012,col});
  }
  const sk=Math.min(20,8+combo);
  for(let i=0;i<sk;i++){
    const a=Math.random()*Math.PI*2, sp=(3+Math.random()*5)*s;
    addParticle({type:'spark',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      len:5+Math.random()*10,life:1,decay:0.04+Math.random()*0.025,col:'#ffffff'});
  }
  for(let i=0;i<3;i++){
    addParticle({type:'smoke',x:cx+(Math.random()-.5)*20,y:cy+(Math.random()-.5)*10,
      vx:(Math.random()-.5)*.8,vy:-.4-Math.random()*.5,
      r:5+Math.random()*6,life:1,decay:0.018,col});
  }
  if(combo>2){
    addParticle({type:'flash',x:cx,y:cy,r:0,mr:44+Math.min(combo,8)*10,life:1,col,decay:0.075});
  }
}
function spawnHit(x,y,w,h,col){
  const cx=x+w/2,cy=y+h/2;
  for(let i=0;i<4;i++){
    const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*2.5;
    addParticle({type:'spark',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      len:3+Math.random()*5,life:1,decay:0.075,col:'#ffffff88'});
  }
  addParticle({type:'ring',x:cx,y:cy,r:0,mr:15,life:0.6,col,decay:0.065});
}
function spawnTrail(x,y,col){
  addParticle({type:'trail',x,y,r:BR*.62,life:0.55,decay:0.13,col});
}
function spawnPadHit(px,py,pw){
  for(let i=0;i<6;i++){
    const a=-Math.PI+Math.random()*Math.PI;
    addParticle({type:'spark',x:px+pw*.5,y:py,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2-1.5,
      len:5+Math.random()*8,life:1,decay:0.065,col:CYAN});
  }
  addParticle({type:'flash',x:px+pw*.5,y:py,r:0,mr:28,life:0.8,col:CYAN,decay:0.11});
}

function updPart(dt=1){
  const d=Math.min(dt,MAX_DT);
  particles=particles.filter(p=>{
    p.life-=(p.decay||0.03)*d;
    if(p.type==='shard'){
      p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=0.15*d;p.vx*=Math.pow(.97,d);p.rot+=p.rv*d;
    }else if(p.type==='spark'){
      p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=.06*d;p.vx*=Math.pow(.96,d);
    }else if(p.type==='smoke'){
      p.x+=p.vx*d;p.y+=p.vy*d;p.r+=.25*d;
    }else if(p.type==='ring'||p.type==='flash'){
      p.r+=(p.mr-p.r)*(1-Math.pow(.7,d));
    }else if(p.type==='trail'){
      p.r*=Math.pow(.9,d);
    }
    return p.life>0;
  });
}
function drawPart(){
  const highQuality=particles.length<180;
  for(const p of particles){
    ctx.save();
    const a=p.life*(p.type==='smoke'?.3:p.type==='ring'?.8:p.type==='flash'?.25:p.type==='trail'?.4:.95);
    ctx.globalAlpha=Math.max(0,a);
    if(p.type==='shard'){
      ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=highQuality?7:0;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    }else if(p.type==='spark'){
      const d=Math.hypot(p.vx,p.vy)||1;
      ctx.strokeStyle=p.col;ctx.lineWidth=1.7;
      ctx.shadowColor=p.col;ctx.shadowBlur=highQuality?7:0;
      ctx.beginPath();
      ctx.moveTo(p.x-(p.vx/d)*p.len*p.life,p.y-(p.vy/d)*p.len*p.life);
      ctx.lineTo(p.x,p.y);ctx.stroke();
    }else if(p.type==='smoke'){
      ctx.fillStyle=p.col;ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }else if(p.type==='ring'){
      ctx.strokeStyle=p.col;ctx.lineWidth=2*p.life;
      ctx.shadowColor=p.col;ctx.shadowBlur=highQuality?9:0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
    }else if(p.type==='flash'){
      if(highQuality){
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
        g.addColorStop(0,p.col+'88');g.addColorStop(1,'transparent');
        ctx.fillStyle=g;
      }else ctx.fillStyle=p.col+'22';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }else if(p.type==='trail'){
      ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=highQuality?5:0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

let shk=0,skx=0,sky=0;
function shake(a){shk=Math.max(shk,a);}
function updShk(dt=1){
  if(shk>.3){skx=(Math.random()-.5)*shk*2.2;sky=(Math.random()-.5)*shk*2.2;shk*=Math.pow(.72,dt);}
  else{shk=0;skx=0;sky=0;}
}

let keys={},mouseX=-1,animId=null,running=false,best=0,lastTime=0,stageTransition=null;
const HUD={sv:document.getElementById('sv'),lv:document.getElementById('lv'),lsv:document.getElementById('lsv'),bv:document.getElementById('bv'),cv:document.getElementById('cv'),bar:document.getElementById('pu-bar')};
let hudCache={score:null,lv:null,lives:null,best:null,combo:null,pu:''};
const PU_T=['wide','slow','multi','laser','shield','fire'];
function rpu(){return PU_T[Math.floor(Math.random()*PU_T.length)];}

function mkBricks(lv){
  const rows=Math.min(4+Math.floor(lv*.7),ROWS);
  const bricks=[];
  for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++){
    const pi=Math.floor(r*PALETTES.length/rows);
    const hp=(lv>=3&&r<2)?2:(lv>=6&&r===0)?3:1;
    if(lv>=3&&Math.random()<.07)continue;
    const isBoss=lv>=5&&r===0&&(c===2||c===7);
    bricks.push({
      x:BOX+c*(BW+BP),y:BOY+r*(BH+BP),
      w:BW,h:BH,hp,maxhp:hp,pi,
      pu:Math.random()<.13?rpu():null,
      flash:0,alive:true,boss:isBoss,
      glitch:0,
    });
  }
  return bricks;
}

function initState(lv){
  const sp=BSPD+lv*SINC;
  const ang=(Math.random()*50-25)*Math.PI/180;
  return{
    lv,score:0,lives:3,
    pad:{x:W/2-PW/2,y:H-38,w:PW,h:PH},
    balls:[{x:W/2,y:H-55,vx:Math.sin(ang)*sp,vy:-Math.cos(ang)*sp,r:BR,trailWait:0}],
    bricks:mkBricks(lv),
    pus:[],apu:{},combo:0,lhit:0,
    launched:false,shield:false,
    lasers:[],lcd:0,
    glitchTimer:0,
    score_floats:[],
  };
}
let S;

function showStageOverlay(title,sub,color=CYAN){
  const ov=document.getElementById('ov');
  ov.style.display='flex';
  ov.innerHTML=`
    <div id="ov-title" data-text="${title}" style="font-size:32px;font-weight:900;letter-spacing:0.18em;color:${color};text-shadow:0 0 20px ${color}, 0 0 60px ${color}66;position:relative;">${title}</div>
    <div id="ov-sub" style="font-size:12px;color:#00f5ffbb;letter-spacing:0.1em;text-align:center;line-height:2.1;">${sub}</div>`;
}
function hideStageOverlay(){document.getElementById('ov').style.display='none';}

function beginStageClear(){
  if(stageTransition)return;
  stageTransition={phase:'clear',timer:0,nextLv:S.lv+1,score:S.score,lives:S.lives};
  S.launched=false;S.pus=[];S.lasers=[];S.apu={};S.shield=false;S.pad.w=PW;S.combo=0;
  sfx('clear');shake(7);
  showStageOverlay('STAGE CLEAR',`SCORE &nbsp;<span style="color:#00f5ff;font-size:18px;font-weight:700;text-shadow:0 0 10px #00f5ff">${S.score.toLocaleString()}</span><br>NEXT STAGE LOADING`,GREEN);
  updHUD(true);
}
function startNextStage(){
  const tr=stageTransition;if(!tr)return;
  S=initState(tr.nextLv);
  S.score=tr.score;S.lives=tr.lives;
  hudCache={score:null,lv:null,lives:null,best:null,combo:null,pu:''};
  updHUD(true);
  showStageOverlay(`STAGE ${S.lv}`,`GET READY<br><span style="color:#ff2d78">AUTO START</span>`,CYAN);
}
function updateStageTransition(dt){
  if(!stageTransition)return false;
  stageTransition.timer+=dt;
  if(stageTransition.phase==='clear'&&stageTransition.timer>=72){
    stageTransition.phase='next';stageTransition.timer=0;
    startNextStage();
  }else if(stageTransition.phase==='next'&&stageTransition.timer>=90){
    S.launched=true;
    stageTransition=null;
    hideStageOverlay();
    lastTime=performance.now();
  }
  updHUD();
  return true;
}

function startGame(){
  if(sfxCtx&&sfxCtx.state==='suspended')sfxCtx.resume();
  stageTransition=null;
  hideStageOverlay();
  particles=[];hudCache={score:null,lv:null,lives:null,best:null,combo:null,pu:''};
  S=initState(1);running=true;lastTime=performance.now();
  if(animId)cancelAnimationFrame(animId);
  loop(lastTime);
}
function nextLevel(){beginStageClear();}

function setHudText(el,val){
  if(el.textContent!==String(val))el.textContent=val;
}
function updHUD(force=false){
  const score=S.score.toLocaleString();
  const lives=['♥','♥','♥'].map((_,i)=>i<S.lives?'♥':'♡').join('');
  const combo='x'+Math.max(1,S.combo);
  if(force||hudCache.score!==score){setHudText(HUD.sv,score);hudCache.score=score;}
  if(force||hudCache.lv!==S.lv){setHudText(HUD.lv,S.lv);hudCache.lv=S.lv;}
  if(force||hudCache.lives!==lives){setHudText(HUD.lsv,lives);hudCache.lives=lives;}
  if(force||hudCache.combo!==combo){setHudText(HUD.cv,combo);hudCache.combo=combo;}
  if(S.score>best){best=S.score;}
  const bestText=best.toLocaleString();
  if(force||hudCache.best!==bestText){setHudText(HUD.bv,bestText);hudCache.best=bestText;}
  updPUBar(force);
}
function updPUBar(force=false){
  const active=Object.entries(S.apu).filter(([,v])=>v>0).map(([k])=>k).sort();
  const key=active.join('|');
  if(!force&&hudCache.pu===key)return;
  hudCache.pu=key;
  HUD.bar.innerHTML='';
  const info={wide:{l:'WIDE',c:CYAN},slow:{l:'SLOW',c:GREEN},multi:{l:'MULTI',c:PINK},
    laser:{l:'LASR',c:AMBER},shield:{l:'SHLD',c:PURPLE},fire:{l:'FIRE',c:ORANGE}};
  for(const k of active){
    const p=info[k]||{l:k,c:'#fff'};
    const el=document.createElement('span');el.className='pu-badge';
    el.textContent=p.l;el.style.color=p.c;el.style.borderColor=p.c;
    el.style.background=p.c+'18';HUD.bar.appendChild(el);
  }
}

function setBallSpeed(b,target){
  const s=Math.hypot(b.vx,b.vy);
  if(!Number.isFinite(s)||s<=0){b.vx=0;b.vy=-target;return;}
  b.vx=b.vx/s*target;b.vy=b.vy/s*target;
}
function applyPU(t){
  sfx('pu');
  if(t==='wide'){S.apu.wide=700;S.pad.w=PW*1.75;}
  if(t==='slow'){
    // Refresh duration, but do not multiply speed repeatedly if slow is already active.
    if(!S.apu.slow||S.apu.slow<=0){
      S.balls.forEach(b=>setBallSpeed(b,Math.max(1.1,Math.hypot(b.vx,b.vy)*.55)));
    }
    S.apu.slow=600;
  }
  if(t==='multi'){
    S.apu.multi=1;
    const b0=S.balls[0];
    if(b0&&S.balls.length<5){
      S.balls.push({x:b0.x,y:b0.y,vx:-b0.vx,vy:b0.vy,r:BR,trailWait:0});
      S.balls.push({x:b0.x,y:b0.y,vx:b0.vy,vy:-b0.vx,r:BR,trailWait:0});
    }
  }
  if(t==='laser'){S.apu.laser=450;}
  if(t==='shield'){S.apu.shield=800;S.shield=true;}
  if(t==='fire'){S.apu.fire=400;}
  updHUD(true);
}
function tickPU(dt=1){
  for(const k of Object.keys(S.apu)){
    if(S.apu[k]>0){
      S.apu[k]-=dt;
      if(S.apu[k]<=0){
        S.apu[k]=0;
        if(k==='wide')S.pad.w=PW;
        if(k==='shield')S.shield=false;
        if(k==='slow')S.balls.forEach(b=>setBallSpeed(b,BSPD+S.lv*SINC));
      }
    }
  }
}
function hitBrick(br){
  const now=Date.now();
  if(now-S.lhit<350)S.combo++;else S.combo=Math.max(0,S.combo-1);
  S.lhit=now;br.flash=10;br.hp--;
  const col=PALETTES[br.pi][0];
  if(br.hp<=0){
    br.alive=false;
    const pts=(10+S.lv*6)*Math.max(1,S.combo);
    S.score+=pts;
    S.score_floats.push({x:br.x+br.w/2,y:br.y,v:'+'+pts,life:1,col});
    if(S.score_floats.length>24)S.score_floats.splice(0,S.score_floats.length-24);
    spawnDestroy(br.x,br.y,br.w,br.h,col,S.combo);
    shake(3.5+S.combo*.8);
    sfx(br.boss?'boss':'crack',S.combo);
    if(br.pu)S.pus.push({x:br.x,y:br.y,w:30,h:14,type:br.pu,vy:1.3});
  }else{
    spawnHit(br.x,br.y,br.w,br.h,col);
    shake(1.8);sfx('hit',S.combo);
    br.glitch=6;
  }
}

let bgStars=[];
(function initStars(){
  for(let i=0;i<80;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*.8,s:.1+Math.random()*.3,p:Math.random()*Math.PI*2});
})();
function updStars(dt=1){bgStars.forEach(s=>{s.p+=.02*dt;s.y+=s.s*dt;if(s.y>H){s.y=0;s.x=Math.random()*W;}});}

let gridFlicker=0;

function update(dt=1){
  updShk(dt);updPart(dt);updStars(dt);
  S.glitchTimer=Math.max(0,S.glitchTimer-dt);
  gridFlicker=(gridFlicker+dt)%180;

  if(updateStageTransition(dt))return;

  const p=S.pad;
  let tx=p.x;
  if(mouseX>=0)tx=mouseX-p.w/2;
  else{if(keys['ArrowLeft'])tx-=5*dt;if(keys['ArrowRight'])tx+=5*dt;}
  p.x=Math.max(0,Math.min(W-p.w,tx));

  if(!S.launched){S.balls[0].x=p.x+p.w/2;S.balls[0].y=p.y-BR-2;updHUD();return;}

  if(S.lcd>0)S.lcd-=dt;
  if(S.apu.laser>0&&S.lcd<=0){
    S.lasers.push({x:p.x+p.w*.2,y:p.y,w:3,h:16,vy:LSPD});
    S.lasers.push({x:p.x+p.w*.8-3,y:p.y,w:3,h:16,vy:LSPD});
    S.lcd=20;
  }
  S.lasers=S.lasers.filter(l=>{
    l.y-=l.vy*dt;
    for(const br of S.bricks){
      if(!br.alive)continue;
      if(l.x<br.x+br.w&&l.x+l.w>br.x&&l.y<br.y+br.h&&l.y+l.h>br.y){hitBrick(br);return false;}
    }
    return l.y>0;
  });

  for(let bi=S.balls.length-1;bi>=0;bi--){
    const b=S.balls[bi];
    b.trailWait=(b.trailWait||0)-dt;
    if(b.trailWait<=0){spawnTrail(b.x,b.y,S.apu.fire>0?ORANGE:CYAN);b.trailWait=2.25;}

    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx);}
    if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx);}
    if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy);}
    if(b.y+b.r>H){
      if(S.shield){b.vy=-Math.abs(b.vy);b.y=H-b.r-2;}
      else{
        S.balls.splice(bi,1);
        if(S.balls.length===0){
          S.lives--;sfx('die');shake(8);
          if(S.lives<=0){gameOver();return;}
          const ang=(Math.random()*40-20)*Math.PI/180,sp=BSPD+S.lv*SINC;
          S.balls.push({x:p.x+p.w/2,y:p.y-BR-2,vx:Math.sin(ang)*sp,vy:-Math.cos(ang)*sp,r:BR,trailWait:0});
          S.launched=false;S.apu={};S.pad.w=PW;S.shield=false;S.lasers=[];updHUD(true);
        }
        continue;
      }
    }

    if(b.y+b.r>=p.y&&b.y-b.r<=p.y+p.h&&b.x+b.r>=p.x&&b.x-b.r<=p.x+p.w&&b.vy>0){
      const rel=(b.x-(p.x+p.w/2))/(p.w/2);
      const ang=rel*68*Math.PI/180;
      const spd=Math.hypot(b.vx,b.vy);
      const fs=Math.min(spd*(S.apu.fire>0?1.04:1),MSPD);
      b.vx=Math.sin(ang)*fs;b.vy=-Math.cos(ang)*fs;b.y=p.y-b.r-1;
      spawnPadHit(p.x,p.y,p.w);sfx('pad');S.combo=0;
    }

    for(const br of S.bricks){
      if(!br.alive)continue;
      const dx=Math.max(br.x-b.x,0,b.x-(br.x+br.w));
      const dy=Math.max(br.y-b.y,0,b.y-(br.y+br.h));
      if(dx*dx+dy*dy<=b.r*b.r){
        if(!S.apu.fire){
          const overlapLeft=b.x+b.r-br.x;
          const overlapRight=br.x+br.w-(b.x-b.r);
          const overlapTop=b.y+b.r-br.y;
          const overlapBottom=br.y+br.h-(b.y-b.r);
          const minX=Math.min(overlapLeft,overlapRight);
          const minY=Math.min(overlapTop,overlapBottom);
          if(minX<minY){
            if(overlapLeft<overlapRight){b.x=br.x-b.r-.2;b.vx=-Math.abs(b.vx);}
            else{b.x=br.x+br.w+b.r+.2;b.vx=Math.abs(b.vx);}
          }else{
            if(overlapTop<overlapBottom){b.y=br.y-b.r-.2;b.vy=-Math.abs(b.vy);}
            else{b.y=br.y+br.h+b.r+.2;b.vy=Math.abs(b.vy);}
          }
        }
        hitBrick(br);
        break; // One brick collision per ball per frame prevents particle/audio bursts.
      }
    }
  }

  S.pus=S.pus.filter(pu=>{
    pu.y+=pu.vy*dt;if(pu.y>H)return false;
    if(pu.x+pu.w>p.x&&pu.x<p.x+p.w&&pu.y+pu.h>p.y&&pu.y<p.y+p.h){applyPU(pu.type);return false;}
    return true;
  });
  tickPU(dt);
  S.score_floats=S.score_floats.filter(f=>{f.y-=.8*dt;f.life-=.02*dt;return f.life>0;});
  for(const br of S.bricks){if(br.flash>0)br.flash=Math.max(0,br.flash-dt);if(br.glitch>0)br.glitch=Math.max(0,br.glitch-dt);}
  if(S.bricks.every(b=>!b.alive)){nextLevel();return;}
  updHUD();
}

function drawGrid(){
  ctx.save();
  ctx.strokeStyle='#00f5ff';
  const gridAlpha=0.025+(Math.sin(gridFlicker*.035)*.012);
  ctx.globalAlpha=gridAlpha;ctx.lineWidth=.5;
  const gs=40;
  for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
}
function drawStars(){
  ctx.save();ctx.fillStyle=CYAN;ctx.shadowColor=CYAN;ctx.shadowBlur=particles.length<180?3:0;
  for(const s of bgStars){
    ctx.globalAlpha=(.4+.6*Math.sin(s.p))*.5;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawBrick(br){
  if(!br.alive)return;
  const[c1,c2]=PALETTES[br.pi];
  const fl=br.flash/10;
  ctx.save();
  if(fl>0){const cx=br.x+br.w/2,cy=br.y+br.h/2;ctx.translate(cx,cy);ctx.scale(1+fl*.07,1+fl*.07);ctx.translate(-cx,-cy);}
  if(br.glitch>0){ctx.translate((Math.random()-.5)*3,(Math.random()-.5)*2);}

  const x=br.x,y=br.y,w=br.w,h=br.h;
  if(fl>0){ctx.fillStyle='#ffffff';ctx.globalAlpha=fl*.7;}else{ctx.fillStyle=c1+'33';ctx.globalAlpha=1;}
  ctx.fillRect(x,y,w,h);

  ctx.globalAlpha=1;
  ctx.strokeStyle=c1;ctx.lineWidth=1;
  ctx.shadowColor=c1;ctx.shadowBlur=fl>0?20:8;
  ctx.strokeRect(x+.5,y+.5,w-1,h-1);

  ctx.strokeStyle=c2+'66';ctx.lineWidth=.5;ctx.shadowBlur=0;
  ctx.strokeRect(x+3,y+2,w-6,h-4);

  if(fl>0){ctx.shadowColor=c1;ctx.shadowBlur=30;ctx.strokeStyle=c1;ctx.lineWidth=1.5;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}

  if(br.maxhp>1&&br.hp>0){
    ctx.fillStyle=c1;ctx.font='bold 9px "Courier New"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=c1;ctx.shadowBlur=6;
    ctx.fillText(br.hp,x+w/2,y+h/2);
  }
  if(br.pu){
    ctx.fillStyle='#ffffff';ctx.globalAlpha=.7;
    ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText('◆',x+w/2,y+h/2+(br.maxhp>1?6:0));
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawPaddle(){
  const p=S.pad;
  ctx.save();
  ctx.fillStyle='#0a1a2a';ctx.shadowColor=CYAN;ctx.shadowBlur=S.apu.fire>0?0:15;
  ctx.fillRect(p.x,p.y,p.w,p.h);
  const c=S.apu.fire>0?ORANGE:CYAN;
  ctx.strokeStyle=c;ctx.lineWidth=1;ctx.shadowColor=c;ctx.shadowBlur=12;
  ctx.strokeRect(p.x+.5,p.y+.5,p.w-1,p.h-1);
  ctx.strokeStyle=c+'88';ctx.lineWidth=.5;ctx.shadowBlur=0;
  ctx.strokeRect(p.x+3,p.y+2,p.w-6,p.h-4);
  ctx.fillStyle=c+'22';ctx.fillRect(p.x+1,p.y+1,p.w-2,p.h-2);
  const seg=p.w/6;
  ctx.strokeStyle=c+'44';ctx.lineWidth=.5;
  for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(p.x+seg*i,p.y+2);ctx.lineTo(p.x+seg*i,p.y+p.h-2);ctx.stroke();}
  ctx.restore();
}

function drawBall(b){
  ctx.save();
  const c=S.apu.fire>0?ORANGE:CYAN;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle=c+'22';ctx.fill();
  ctx.strokeStyle=c;ctx.lineWidth=1.5;
  ctx.shadowColor=c;ctx.shadowBlur=16;ctx.stroke();
  ctx.beginPath();ctx.arc(b.x,b.y,b.r*.35,0,Math.PI*2);
  ctx.fillStyle='#ffffff';ctx.shadowBlur=4;ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.save();ctx.translate(skx,sky);
  ctx.fillStyle='#000008';ctx.fillRect(-4,-4,W+8,H+8);
  drawGrid();drawStars();
  for(const br of S.bricks)drawBrick(br);
  drawPart();
  const puc={wide:CYAN,slow:GREEN,multi:PINK,laser:AMBER,shield:PURPLE,fire:ORANGE};
  for(const pu of S.pus){
    const c=puc[pu.type]||'#fff';
    ctx.save();ctx.fillStyle=c+'22';ctx.strokeStyle=c;
    ctx.lineWidth=1;ctx.shadowColor=c;ctx.shadowBlur=8;
    ctx.beginPath();ctx.roundRect(pu.x,pu.y,pu.w,pu.h,2);ctx.fill();ctx.stroke();
    ctx.fillStyle=c;ctx.font='bold 8px "Courier New"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pu.type.toUpperCase().slice(0,4),pu.x+pu.w/2,pu.y+pu.h/2);
    ctx.restore();
  }
  for(const l of S.lasers){
    ctx.save();ctx.fillStyle=AMBER;ctx.shadowColor=AMBER;ctx.shadowBlur=12;
    ctx.globalAlpha=.95;ctx.fillRect(l.x,l.y,l.w,l.h);
    ctx.restore();
  }
  drawPaddle();
  if(S.shield){
    ctx.save();ctx.strokeStyle=PURPLE;ctx.lineWidth=2;ctx.globalAlpha=.5;
    ctx.shadowColor=PURPLE;ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(0,H-8);ctx.lineTo(W,H-8);ctx.stroke();
    ctx.restore();
  }
  for(const b of S.balls)drawBall(b);
  for(const f of S.score_floats){
    ctx.save();ctx.globalAlpha=f.life;
    ctx.fillStyle=S.combo>3?PINK:CYAN;
    ctx.shadowColor=S.combo>3?PINK:CYAN;ctx.shadowBlur=8;
    ctx.font=`bold ${11+Math.min(S.combo,5)}px "Courier New"`;
    ctx.textAlign='center';ctx.fillText(f.v,f.x,f.y);
    ctx.restore();
  }
  if(!S.launched){
    ctx.save();
    const blink=Math.sin(Date.now()/300)>.2;
    if(blink){
      ctx.fillStyle=CYAN;ctx.shadowColor=CYAN;ctx.shadowBlur=10;
      ctx.font='12px "Courier New"';ctx.textAlign='center';
      ctx.fillText('[ CLICK / SPACE TO LAUNCH ]',W/2,H-75);
    }
    ctx.restore();
  }
  if(S.combo>2){
    const cx=S.combo>5?PINK:AMBER;
    ctx.save();
    ctx.fillStyle=cx;ctx.shadowColor=cx;ctx.shadowBlur=15;
    ctx.font=`bold ${Math.min(12+S.combo,28)}px "Courier New"`;ctx.textAlign='center';
    ctx.fillText(`COMBO ×${S.combo}`,W/2,34);
    ctx.restore();
  }
  ctx.restore();
}

function gameOver(){
  stageTransition=null;
  running=false;cancelAnimationFrame(animId);
  const ov=document.getElementById('ov');ov.style.display='flex';
  ov.innerHTML=`
    <div id="ov-title" data-text="GAME OVER" style="font-size:32px;font-weight:900;letter-spacing:0.2em;color:#ff2d78;text-shadow:0 0 20px #ff2d78, 0 0 60px #ff2d7866;position:relative;">GAME OVER</div>
    <div id="ov-sub" style="font-size:12px;color:#00f5ff88;letter-spacing:0.1em;text-align:center;line-height:2.2;">
      SCORE &nbsp;<span style="color:#00f5ff;font-size:20px;font-weight:700;text-shadow:0 0 10px #00f5ff">${S.score.toLocaleString()}</span><br>
      BEST &nbsp;<span style="color:#ff2d78;font-size:16px;font-weight:700;text-shadow:0 0 10px #ff2d78">${best.toLocaleString()}</span>
    </div>
    <button id="ob" style="padding:10px 36px;background:transparent;border:1px solid #ff2d78;color:#ff2d78;font-size:13px;font-family:'Courier New',monospace;letter-spacing:0.15em;cursor:pointer;text-transform:uppercase;text-shadow:0 0 8px #ff2d78;box-shadow:0 0 12px #ff2d7844;">[ RETRY ]</button>`;
  document.getElementById('ob').onclick=startGame;
}

function loop(ts=performance.now()){
  if(!running)return;
  const dt=Math.min(MAX_DT,Math.max(0.25,(ts-lastTime)/FRAME_MS||1));
  lastTime=ts;
  update(dt);draw();
  animId=requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=(e.clientX-r.left)*(W/r.width);});
canvas.addEventListener('mouseleave',()=>{mouseX=-1;});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();mouseX=(e.touches[0].clientX-r.left)*(W/r.width);},{passive:false});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();if(running&&!S.launched&&!stageTransition)S.launched=true;}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();mouseX=-1;}});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
canvas.addEventListener('click',()=>{if(running&&!S.launched&&!stageTransition)S.launched=true;});
document.getElementById('ob').addEventListener('click',startGame);
</script>
