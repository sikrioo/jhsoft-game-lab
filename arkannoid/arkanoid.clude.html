
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
#game-root {
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 0; font-family: var(--font-mono, monospace); user-select: none;
}
#hud {
  display: flex; gap: 40px; margin-bottom: 14px;
  width: 480px; justify-content: space-between;
}
.hud-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.hud-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); }
.hud-val { font-size: 18px; font-weight: 500; color: var(--color-text-primary); min-width: 60px; text-align: center; }
#canvas-wrap { position: relative; border-radius: 12px; overflow: hidden; border: 0.5px solid var(--color-border-secondary); }
canvas { display: block; }
#overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.75); color: #fff; gap: 12px;
}
#overlay h2 { font-size: 22px; font-weight: 500; letter-spacing: 0.04em; }
#overlay p { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; line-height: 1.7; max-width: 300px; }
#overlay button {
  margin-top: 8px; padding: 10px 28px;
  background: rgba(255,255,255,0.12); border: 0.5px solid rgba(255,255,255,0.35);
  border-radius: 8px; color: #fff; font-size: 14px; cursor: pointer;
}
#overlay button:hover { background: rgba(255,255,255,0.22); }
#controls-hint { margin-top: 10px; font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.04em; }
#powerup-bar { display: flex; gap: 8px; margin-top: 10px; height: 24px; width: 480px; align-items: center; }
.pu-badge { padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; border: 0.5px solid; }
</style>

<div id="game-root">
  <div id="hud">
    <div class="hud-item"><span class="hud-label">Score</span><span class="hud-val" id="score-val">0</span></div>
    <div class="hud-item"><span class="hud-label">Level</span><span class="hud-val" id="level-val">1</span></div>
    <div class="hud-item"><span class="hud-label">Lives</span><span class="hud-val" id="lives-val">♥ ♥ ♥</span></div>
    <div class="hud-item"><span class="hud-label">Best</span><span class="hud-val" id="best-val">0</span></div>
    <div class="hud-item"><span class="hud-label">Combo</span><span class="hud-val" id="combo-val">x1</span></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c" width="480" height="560"></canvas>
    <div id="overlay">
      <h2>ARKANOID</h2>
      <p>마우스 또는 ←→ 키로 패들을 조작하세요<br>파워업 아이템을 놓치지 마세요!</p>
      <button id="start-btn">게임 시작</button>
    </div>
  </div>
  <div id="powerup-bar"></div>
  <div id="controls-hint">Mouse / Arrow Keys / Touch to play</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480, H = 560;

const BRICK_COLS = 10, BRICK_ROWS = 7;
const BW = 42, BH = 16, BPAD = 3;
const BOFF_X = (W - (BRICK_COLS*(BW+BPAD)-BPAD)) / 2;
const BOFF_Y = 52;
const PW = 80, PH = 12, BALL_R = 7;
const BASE_SPEED = 2.2, SPEED_INC = 0.25, MAX_SPEED = 5.5;
const LASER_VY = -5, PU_DROP = 1.2, PAD_SPD = 5;

const BRICK_COLORS = [
  ['#e2453c','#ff8f8f'],['#e07b39','#f5b27a'],['#e6b830','#ffd980'],
  ['#4caf6e','#7fe0a0'],['#3b82f6','#7ab8fa'],['#8b5cf6','#b89afa'],['#ec4899','#f49ed0'],
];

// ── 사운드 엔진 ──
const sfxCtx = (() => { try { return new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} })();
function playTone(freq, type, dur, vol, freqEnd) {
  if (!sfxCtx) return;
  const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
  o.connect(g); g.connect(sfxCtx.destination);
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, sfxCtx.currentTime);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, sfxCtx.currentTime + dur);
  g.gain.setValueAtTime(vol, sfxCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + dur);
  o.start(); o.stop(sfxCtx.currentTime + dur);
}
function sfx(type, combo) {
  if (!sfxCtx) return;
  if (type === 'hit') {
    // 타격음: 날카로운 어택 + 짧은 노이즈 레이어
    playTone(180 + combo*40, 'square', 0.06, 0.3, 80);
    playTone(900, 'sawtooth', 0.04, 0.15, 400);
  }
  if (type === 'crack') {
    // 벽돌 파괴: 강한 타격 + 잔향
    playTone(120, 'square', 0.12, 0.4, 40);
    playTone(800, 'sawtooth', 0.08, 0.25, 200);
    playTone(1600, 'sine', 0.05, 0.1, 600);
  }
  if (type === 'paddle') {
    playTone(280, 'sine', 0.08, 0.25, 200);
    playTone(560, 'sine', 0.05, 0.1, 400);
  }
  if (type === 'die') { playTone(200,'sawtooth',0.5,0.3,40); }
  if (type === 'pu')  { playTone(523,'sine',0.06,0.2,1046); playTone(784,'sine',0.12,0.15,1046); }
  if (type === 'clear') { playTone(523,'sine',0.08,0.2); playTone(659,'sine',0.08,0.2); playTone(784,'sine',0.15,0.25); }
}

// ── 파티클 시스템 ──
// 타입: 'shard'(파편), 'spark'(스파크), 'flash'(플래시), 'smoke'(연기), 'ring'(충격파)
let particles = [];

function spawnBrickDestroy(x, y, w, h, color, combo) {
  const cx = x + w/2, cy = y + h/2;
  const intensity = 1 + combo * 0.2;

  // 1. 충격파 링
  particles.push({ type:'ring', x:cx, y:cy, r:0, maxR: 28 + combo*6, life:1, color });

  // 2. 벽돌 파편 — 직사각형 조각들
  const shardCount = 6 + Math.floor(combo * 1.5);
  for (let i = 0; i < shardCount; i++) {
    const ang = (Math.PI*2 / shardCount)*i + (Math.random()-0.5)*0.4;
    const spd = (1.8 + Math.random()*3.0) * intensity;
    particles.push({
      type:'shard',
      x: cx + (Math.random()-0.5)*w*0.6,
      y: cy + (Math.random()-0.5)*h*0.6,
      vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      w: 3+Math.random()*8, h: 3+Math.random()*5,
      rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.4,
      life: 1, decay: 0.022 + Math.random()*0.012,
      color, colorDark: color,
    });
  }

  // 3. 스파크 — 빠르고 밝은 선 파티클
  const sparkCount = 8 + combo * 2;
  for (let i = 0; i < sparkCount; i++) {
    const ang = Math.random()*Math.PI*2;
    const spd = (2.5 + Math.random()*5) * intensity;
    particles.push({
      type:'spark',
      x: cx, y: cy,
      vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      len: 4 + Math.random()*10,
      life: 1, decay: 0.04 + Math.random()*0.03,
      color: '#ffffff',
    });
  }

  // 4. 연기 — 느리고 크게 퍼지는 원
  for (let i = 0; i < 3; i++) {
    particles.push({
      type:'smoke',
      x: cx + (Math.random()-0.5)*16,
      y: cy + (Math.random()-0.5)*8,
      vx: (Math.random()-0.5)*0.8,
      vy: -0.3 - Math.random()*0.5,
      r: 4+Math.random()*6,
      life: 1, decay: 0.018 + Math.random()*0.01,
      color,
    });
  }
}

function spawnBrickHit(x, y, w, h, color) {
  const cx = x+w/2, cy = y+h/2;
  // 피격 시: 작은 스파크 + 작은 파편 2~3개
  for (let i = 0; i < 4; i++) {
    const ang = Math.random()*Math.PI*2;
    const spd = 1.2 + Math.random()*2;
    particles.push({
      type:'spark', x:cx, y:cy,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      len:3+Math.random()*5, life:1, decay:0.06+Math.random()*0.04, color:'#ffffffcc'
    });
  }
  particles.push({ type:'ring', x:cx, y:cy, r:0, maxR:14, life:0.7, color });
}

function spawnPaddleHit(px, py, pw) {
  for (let i = 0; i < 6; i++) {
    const ang = -Math.PI + Math.random()*Math.PI;
    particles.push({
      type:'spark', x:px + pw*0.5, y:py,
      vx:Math.cos(ang)*2, vy:Math.sin(ang)*2-1,
      len:4+Math.random()*6, life:1, decay:0.07, color:'#a0c8ff'
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => {
    p.life -= p.decay || 0.02;
    if (p.type === 'shard') {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.18; // 중력
      p.vx *= 0.97;
      p.rot += p.rotV;
    } else if (p.type === 'spark') {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.08;
      p.vx *= 0.96;
    } else if (p.type === 'smoke') {
      p.x += p.vx; p.y += p.vy;
      p.r += 0.3;
    } else if (p.type === 'ring') {
      p.r += (p.maxR - p.r) * 0.35;
    }
    return p.life > 0;
  });
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life * (p.type === 'smoke' ? 0.35 : p.type === 'ring' ? 0.7 : 0.95);

    if (p.type === 'shard') {
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 4;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);

    } else if (p.type === 'spark') {
      const nx = p.vx / (Math.hypot(p.vx,p.vy)||1);
      const ny = p.vy / (Math.hypot(p.vx,p.vy)||1);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(p.x - nx*p.len*p.life, p.y - ny*p.len*p.life);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

    } else if (p.type === 'smoke') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();

    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2 * p.life;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ── 화면 흔들림 ──
let shakeAmt = 0, shakeX = 0, shakeY = 0;
function triggerShake(amount) { shakeAmt = Math.max(shakeAmt, amount); }
function updateShake() {
  if (shakeAmt > 0.3) {
    shakeX = (Math.random()-0.5)*shakeAmt*2;
    shakeY = (Math.random()-0.5)*shakeAmt*2;
    shakeAmt *= 0.75;
  } else { shakeAmt = 0; shakeX = 0; shakeY = 0; }
}

// ── 게임 상태 ──
let state, keys={}, mouseX=-1, animId=null, gameRunning=false, bestScore=0;

const PU_TYPES = ['wide','slow','multi','laser','shield','fire'];
function randPU() { return PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)]; }

function mkBricks(level) {
  const rows = Math.min(4+level, BRICK_ROWS);
  const bricks = [];
  for (let r=0; r<rows; r++) for (let c=0; c<BRICK_COLS; c++) {
    const ci = Math.floor(r*BRICK_COLORS.length/rows);
    const hp = (level>=3&&r<2)?2:(level>=5&&r===0)?3:1;
    if (level>=3 && Math.random()<0.07) continue;
    bricks.push({
      x:BOFF_X+c*(BW+BPAD), y:BOFF_Y+r*(BH+BPAD),
      w:BW, h:BH, hp, maxhp:hp, ci,
      pu: Math.random()<0.12?randPU():null,
      hitFlash:0, alive:true,
    });
  }
  return bricks;
}

function initState(level) {
  const sp = BASE_SPEED + level*SPEED_INC;
  const ang = (Math.random()*60-30)*Math.PI/180;
  return {
    level, score:0, lives:3,
    paddle:{ x:W/2-PW/2, y:H-36, w:PW, h:PH },
    balls:[{ x:W/2, y:H-52, vx:Math.sin(ang)*sp, vy:-Math.cos(ang)*sp, r:BALL_R }],
    bricks:mkBricks(level),
    powerups:[], activePU:{}, combo:0, lastHit:0,
    launched:false, shieldActive:false, lasers:[], laserCd:0,
  };
}

function startGame() {
  document.getElementById('overlay').style.display='none';
  particles=[];
  state=initState(1);
  gameRunning=true;
  if(animId) cancelAnimationFrame(animId);
  loop();
}

function nextLevel() {
  const sc=state.score, lv=state.lives;
  state=initState(state.level+1);
  state.score=sc; state.lives=lv;
  sfx('clear'); updateHUD();
}

function updateHUD() {
  document.getElementById('score-val').textContent=state.score;
  document.getElementById('level-val').textContent=state.level;
  document.getElementById('lives-val').textContent=['♥','♥','♥'].map((h,i)=>i<state.lives?'♥':'♡').join(' ');
  document.getElementById('combo-val').textContent='x'+Math.max(1,state.combo);
  if(state.score>bestScore){bestScore=state.score;document.getElementById('best-val').textContent=bestScore;}
  updatePUBar();
}

function updatePUBar() {
  const bar=document.getElementById('powerup-bar'); bar.innerHTML='';
  const puInfo={wide:{label:'WIDE',color:'#60a5fa',bg:'#1e3a5f'},slow:{label:'SLOW',color:'#6fcf97',bg:'#1a3d29'},multi:{label:'MULTI',color:'#f472b6',bg:'#3d1a2f'},laser:{label:'LASER',color:'#ffd166',bg:'#3d2e0a'},shield:{label:'SHIELD',color:'#a78bfa',bg:'#2a1a4f'},fire:{label:'FIRE',color:'#ff6b6b',bg:'#3d1010'}};
  for(const[k,v]of Object.entries(state.activePU)){if(v>0){const p=puInfo[k]||{};const el=document.createElement('span');el.className='pu-badge';el.textContent=p.label||k.toUpperCase();el.style.color=p.color||'#fff';el.style.background=p.bg||'#222';el.style.borderColor=p.color||'#fff';bar.appendChild(el);}}
}

function applyPU(type){
  sfx('pu');
  if(type==='wide'){state.activePU.wide=600;state.paddle.w=PW*1.7;}
  if(type==='slow'){state.activePU.slow=500;state.balls.forEach(b=>{const s=Math.hypot(b.vx,b.vy);b.vx=b.vx/s*(s*0.6);b.vy=b.vy/s*(s*0.6);});}
  if(type==='multi'){state.activePU.multi=1;const b0=state.balls[0];if(state.balls.length<4){state.balls.push({x:b0.x,y:b0.y,vx:-b0.vx,vy:b0.vy,r:BALL_R});state.balls.push({x:b0.x,y:b0.y,vx:b0.vy,vy:-b0.vx,r:BALL_R});}}
  if(type==='laser'){state.activePU.laser=400;}
  if(type==='shield'){state.activePU.shield=700;state.shieldActive=true;}
  if(type==='fire'){state.activePU.fire=350;}
}

function tickPU(){
  for(const k of Object.keys(state.activePU)){
    if(state.activePU[k]>0){state.activePU[k]--;
      if(state.activePU[k]===0){
        if(k==='wide')state.paddle.w=PW;
        if(k==='shield')state.shieldActive=false;
        if(k==='slow'){state.balls.forEach(b=>{const sp=Math.hypot(b.vx,b.vy);const t=BASE_SPEED+state.level*SPEED_INC;b.vx=b.vx/sp*t;b.vy=b.vy/sp*t;});}
      }
    }
  }
}

function hitBrick(br) {
  const now=Date.now();
  if(now-state.lastHit<300) state.combo++; else state.combo=Math.max(0,state.combo-1);
  state.lastHit=now;
  br.hitFlash=8;
  br.hp--;
  const col = BRICK_COLORS[br.ci][0];
  if(br.hp<=0){
    br.alive=false;
    const pts=(10+state.level*5)*Math.max(1,state.combo);
    state.score+=pts;
    spawnBrickDestroy(br.x, br.y, br.w, br.h, col, state.combo);
    triggerShake(3 + state.combo * 0.8);
    sfx('crack', state.combo);
    if(br.pu) state.powerups.push({x:br.x,y:br.y,w:28,h:14,type:br.pu});
  } else {
    spawnBrickHit(br.x, br.y, br.w, br.h, col);
    triggerShake(1.5);
    sfx('hit', state.combo);
  }
}

function update(){
  updateShake();
  updateParticles();

  const p=state.paddle;
  let tx=p.x;
  if(mouseX>=0) tx=mouseX-p.w/2;
  else { if(keys['ArrowLeft'])tx-=PAD_SPD; if(keys['ArrowRight'])tx+=PAD_SPD; }
  p.x=Math.max(0,Math.min(W-p.w,tx));

  if(!state.launched){state.balls[0].x=p.x+p.w/2;state.balls[0].y=p.y-BALL_R-2;return;}

  if(state.laserCd>0)state.laserCd--;
  if(state.activePU.laser>0&&state.laserCd===0){
    state.lasers.push({x:p.x+p.w*0.2,y:p.y,w:4,h:14,vy:LASER_VY});
    state.lasers.push({x:p.x+p.w*0.8-4,y:p.y,w:4,h:14,vy:LASER_VY});
    state.laserCd=22;
  }
  state.lasers=state.lasers.filter(l=>{
    l.y+=l.vy;
    for(const br of state.bricks){if(!br.alive)continue;if(l.x<br.x+br.w&&l.x+l.w>br.x&&l.y<br.y+br.h&&l.y+l.h>br.y){hitBrick(br);return false;}}
    return l.y>0;
  });

  for(let bi=state.balls.length-1;bi>=0;bi--){
    const ball=state.balls[bi];
    ball.x+=ball.vx; ball.y+=ball.vy;
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
    if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}
    if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}

    if(ball.y+ball.r>H){
      if(state.shieldActive){ball.vy=-Math.abs(ball.vy);ball.y=H-ball.r-2;}
      else{
        state.balls.splice(bi,1);
        if(state.balls.length===0){
          state.lives--;sfx('die');
          if(state.lives<=0){gameOver();return;}
          const ang=(Math.random()*40-20)*Math.PI/180;
          const sp=BASE_SPEED+state.level*SPEED_INC;
          state.balls.push({x:p.x+p.w/2,y:p.y-BALL_R-2,vx:Math.sin(ang)*sp,vy:-Math.cos(ang)*sp,r:BALL_R});
          state.launched=false;state.activePU={};state.paddle.w=PW;state.shieldActive=false;state.lasers=[];
        }
        continue;
      }
    }

    if(ball.y+ball.r>=p.y&&ball.y-ball.r<=p.y+p.h&&ball.x+ball.r>=p.x&&ball.x-ball.r<=p.x+p.w&&ball.vy>0){
      const rel=(ball.x-(p.x+p.w/2))/(p.w/2);
      const angle=rel*65*Math.PI/180;
      const speed=Math.hypot(ball.vx,ball.vy);
      const boost=state.activePU.fire>0?1.04:1;
      const fs=Math.min(speed*boost,MAX_SPEED);
      ball.vx=Math.sin(angle)*fs;ball.vy=-Math.cos(angle)*fs;ball.y=p.y-ball.r-1;
      spawnPaddleHit(p.x,p.y,p.w);
      sfx('paddle');state.combo=0;
    }

    for(const br of state.bricks){
      if(!br.alive)continue;
      const dx=Math.max(br.x-ball.x,0,ball.x-(br.x+br.w));
      const dy=Math.max(br.y-ball.y,0,ball.y-(br.y+br.h));
      if(dx*dx+dy*dy<=ball.r*ball.r){
        if(!state.activePU.fire){
          const oL=Math.abs(ball.x-(br.x+br.w)),oR=Math.abs(br.x-ball.x);
          const oT=Math.abs(ball.y-(br.y+br.h)),oB=Math.abs(br.y-ball.y);
          if(Math.min(oL,oR)<Math.min(oT,oB))ball.vx=-ball.vx;else ball.vy=-ball.vy;
        }
        hitBrick(br);
      }
    }
  }

  state.powerups=state.powerups.filter(pu=>{
    pu.y+=PU_DROP;
    if(pu.y>H)return false;
    const pd=state.paddle;
    if(pu.x+pu.w>pd.x&&pu.x<pd.x+pd.w&&pu.y+pu.h>pd.y&&pu.y<pd.y+pd.h){applyPU(pu.type);return false;}
    return true;
  });
  tickPU();
  for(const br of state.bricks)if(br.hitFlash>0)br.hitFlash--;
  if(state.bricks.filter(b=>b.alive).length===0){nextLevel();return;}
  updateHUD();
}

function draw(){
  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.fillStyle='#0f0f14'; ctx.fillRect(-4,-4,W+8,H+8);
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,BOFF_Y-6);

  // 벽돌
  for(const br of state.bricks){
    if(!br.alive)continue;
    const[c1,c2]=BRICK_COLORS[br.ci];
    const flash=br.hitFlash/8;
    ctx.save();

    // 피격 시 살짝 스케일 충격
    if(flash>0){
      const cx=br.x+br.w/2, cy=br.y+br.h/2;
      ctx.translate(cx,cy);
      const sc=1+flash*0.06;
      ctx.scale(sc,sc);
      ctx.translate(-cx,-cy);
    }

    const r=4;
    ctx.beginPath();
    ctx.moveTo(br.x+r,br.y);ctx.lineTo(br.x+br.w-r,br.y);
    ctx.arcTo(br.x+br.w,br.y,br.x+br.w,br.y+r,r);
    ctx.lineTo(br.x+br.w,br.y+br.h-r);
    ctx.arcTo(br.x+br.w,br.y+br.h,br.x+br.w-r,br.y+br.h,r);
    ctx.lineTo(br.x+r,br.y+br.h);
    ctx.arcTo(br.x,br.y+br.h,br.x,br.y+br.h-r,r);
    ctx.lineTo(br.x,br.y+r);ctx.arcTo(br.x,br.y,br.x+r,br.y,r);ctx.closePath();

    if(flash>0){
      ctx.fillStyle=`rgb(${Math.round(255*flash+parseInt(c1.slice(1,3),16)*(1-flash))},${Math.round(255*flash+parseInt(c1.slice(3,5),16)*(1-flash))},${Math.round(255*flash+parseInt(c1.slice(5,7),16)*(1-flash))})`;
    }else{ctx.fillStyle=c1;}
    ctx.fill();
    ctx.strokeStyle=c2;ctx.lineWidth=0.8;ctx.stroke();

    // 상단 하이라이트
    if(flash===0){
      ctx.beginPath();
      ctx.moveTo(br.x+r,br.y+1);ctx.lineTo(br.x+br.w-r,br.y+1);
      ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.stroke();
    }

    if(br.maxhp>1&&br.hp>0){
      ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(br.hp,br.x+br.w/2,br.y+br.h/2);
    }
    if(br.pu){
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.font='8px sans-serif';ctx.textAlign='center';
      ctx.fillText('★',br.x+br.w/2,br.y+br.h/2+(br.maxhp>1?6:0));
    }
    ctx.restore();
  }

  // 파티클 (벽돌 위에 그려야 자연스러움)
  drawParticles();

  // 파워업 아이템
  const puC={wide:'#60a5fa',slow:'#6fcf97',multi:'#f472b6',laser:'#ffd166',shield:'#a78bfa',fire:'#ff6b6b'};
  for(const pu of state.powerups){
    ctx.globalAlpha=0.9;ctx.fillStyle=puC[pu.type]||'#fff';
    ctx.beginPath();ctx.roundRect(pu.x,pu.y,pu.w,pu.h,3);ctx.fill();
    ctx.fillStyle='#000';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pu.type.toUpperCase().slice(0,4),pu.x+pu.w/2,pu.y+pu.h/2);
    ctx.globalAlpha=1;
  }

  // 레이저
  for(const l of state.lasers){
    ctx.fillStyle='#ffd166';ctx.globalAlpha=0.9;ctx.fillRect(l.x,l.y,l.w,l.h);ctx.globalAlpha=1;
  }

  // 패들
  const pd=state.paddle;
  ctx.save();
  ctx.beginPath();ctx.roundRect(pd.x,pd.y,pd.w,pd.h,6);
  ctx.fillStyle='#e2e8f0';ctx.fill();
  ctx.beginPath();ctx.roundRect(pd.x+3,pd.y+2,pd.w-6,3,2);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fill();
  ctx.restore();

  if(state.shieldActive){
    ctx.save();ctx.strokeStyle='#a78bfa';ctx.lineWidth=2;ctx.globalAlpha=0.6;
    ctx.beginPath();ctx.moveTo(0,H-6);ctx.lineTo(W,H-6);ctx.stroke();ctx.globalAlpha=1;ctx.restore();
  }

  // 공
  for(const ball of state.balls){
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fillStyle=state.activePU.fire>0?'#ff6b6b':'#ffffff';ctx.fill();
    ctx.beginPath();ctx.arc(ball.x-ball.r*0.3,ball.y-ball.r*0.3,ball.r*0.3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fill();
  }

  if(!state.launched){
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText('클릭 또는 스페이스바로 발사',W/2,H-70);
  }

  if(state.combo>2){
    ctx.fillStyle=`rgba(255,220,100,${Math.min(1,(state.combo-2)*0.2)})`;
    ctx.font=`bold ${Math.min(14+state.combo,26)}px monospace`;ctx.textAlign='center';
    ctx.fillText(`COMBO ×${state.combo}`,W/2,30);
  }

  ctx.restore(); // shake restore
}

function gameOver(){
  gameRunning=false;cancelAnimationFrame(animId);
  const ov=document.getElementById('overlay');ov.style.display='flex';
  ov.innerHTML=`<h2>GAME OVER</h2><p>최종 점수: <strong>${state.score}</strong><br>최고 점수: <strong>${bestScore}</strong></p><button id="start-btn">다시 시작</button>`;
  document.getElementById('start-btn').onclick=startGame;
}

function loop(){ if(!gameRunning)return; update();draw(); animId=requestAnimationFrame(loop); }

canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=(e.clientX-r.left)*(W/r.width);});
canvas.addEventListener('mouseleave',()=>{mouseX=-1;});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();mouseX=(e.touches[0].clientX-r.left)*(W/r.width);},{passive:false});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();if(gameRunning&&!state.launched)state.launched=true;}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();mouseX=-1;}});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
canvas.addEventListener('click',()=>{if(gameRunning&&!state.launched)state.launched=true;});
document.getElementById('start-btn').addEventListener('click',startGame);
</script>
