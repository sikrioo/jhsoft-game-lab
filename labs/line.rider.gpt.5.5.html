<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ragdoll Line Rider Prototype</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f7f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #ui {
      position: fixed;
      left: 18px;
      top: 18px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border: 2px solid #111;
      border-radius: 14px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      box-shadow: 4px 4px 0 #111;
      user-select: none;
    }
    button, select {
      border: 2px solid #111;
      border-radius: 10px;
      background: #fff;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { transform: translateY(-1px); }
    #hint {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      padding: 10px 12px;
      border: 2px solid #111;
      border-radius: 14px;
      background: rgba(255,255,255,0.82);
      box-shadow: 4px 4px 0 #111;
      font-size: 13px;
      line-height: 1.45;
    }
    #stats {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 10;
      min-width: 190px;
      padding: 10px 12px;
      border: 2px solid #111;
      border-radius: 14px;
      background: rgba(255,255,255,0.86);
      box-shadow: 4px 4px 0 #111;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="ui">
    <button id="spawnBtn">Respawn Rider</button>
    <button id="clearBtn">Clear Lines</button>
    <button id="resetBtn">Reset</button>
    <select id="toolSelect">
      <option value="line">Draw line</option>
      <option value="boost">Boost pad</option>
    </select>
  </div>

  <div id="hint">
    마우스 드래그: 선 그리기<br />
    Shift + 드래그: 긴 직선 보정<br />
    A/D 또는 ←/→: 이동<br />
    Space/W/↑: 점프<br />
    R: 리셋
  </div>

  <div id="stats">
    SPEED: <span id="statSpeed">0.0</span><br />
    TARGET: <span id="statTargetSpeed">8.0</span><br />
    BOOST: <span id="statBoost">0.0</span><br />
    V-SPEED: <span id="statVertical">0.0</span><br />
    GROUND: <span id="statGround">NO</span>
  </div>

  <canvas id="game"></canvas>

  <script>
    const { Engine, World, Bodies, Body, Constraint, Composite, Events, Vector } = Matter;

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const engine = Engine.create({
      gravity: { x: 0, y: 1.05 },
      positionIterations: 10,
      velocityIterations: 8,
      constraintIterations: 4,
    });
    const world = engine.world;

    const state = {
      lines: [],
      boosts: [],
      staticBodies: [],
      rider: null,
      keys: { left: false, right: false, jump: false },
      jumpQueued: false,
      canJump: false,
      drawing: false,
      drawStart: null,
      drawEnd: null,
      camera: { x: 0, y: 0, targetX: 0, targetY: 0, leadX: 0, leadY: 0 },
      stats: { speed: 0, targetSpeed: 8, boostPower: 0, verticalSpeed: 0, grounded: false },
      lastTime: performance.now(),
      shake: 0,
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getSpeedIntensity(speed = state.stats.speed) {
      return clamp((speed - 18) / 55, 0, 1);
    }

    function getSpeedStage(speed = state.stats.speed) {
      if (speed >= 60) return 3;
      if (speed >= 42) return 2;
      if (speed >= 24) return 1;
      return 0;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function screenToWorld(x, y) {
      return { x: x + state.camera.x, y: y + state.camera.y };
    }

    function addSegment(x1, y1, x2, y2, type = 'line') {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 35) return;

      const angle = Math.atan2(dy, dx);
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;
      const thickness = type === 'boost' ? 14 : 10;
      const body = Bodies.rectangle(cx, cy, len, thickness, {
        isStatic: true,
        angle,
        friction: type === 'boost' ? 0.01 : 0.55,
        restitution: type === 'boost' ? 0.18 : 0.02,
        label: type === 'boost' ? 'boost' : 'line',
      });

      World.add(world, body);
      state.staticBodies.push(body);
      const item = { x1, y1, x2, y2, type, body };
      if (type === 'boost') state.boosts.push(item);
      else state.lines.push(item);
    }

    function addSmoothCurve(startX, startY, sections, type = 'line') {
      let prev = { x: startX, y: startY };
      let cursorX = startX;
      let cursorY = startY;
      const points = [{ x: startX, y: startY }];

      for (const section of sections) {
        const originX = cursorX;
        const originY = cursorY;
        const targetX = originX + section.dx;
        const targetY = originY + section.dy;
        const steps = Math.max(14, Math.round(section.dx / 180));

        for (let i = 1; i <= steps; i += 1) {
          const t = i / steps;
          const eased = 0.5 - Math.cos(Math.PI * t) * 0.5;
          const point = {
            x: originX + section.dx * t,
            y: originY + section.dy * eased,
          };
          addSegment(prev.x, prev.y, point.x, point.y, type);
          prev = point;
          points.push(point);
        }

        cursorX = targetX;
        cursorY = targetY;
      }

      return points;
    }

    function addBoostPadsAlongPath(points, { startOffset = 0, interval = 2600, padLength = 180, maxPads = Infinity } = {}) {
      if (!points || points.length < 2) return;

      let nextDistance = startOffset;
      let placed = 0;
      let traveled = 0;

      for (let i = 1; i < points.length && placed < maxPads; i += 1) {
        const a = points[i - 1];
        const b = points[i];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const segLength = Math.hypot(dx, dy);
        if (segLength < 1) continue;

        while (traveled + segLength >= nextDistance && placed < maxPads) {
          const local = clamp((nextDistance - traveled) / segLength, 0, 1);
          const cx = a.x + dx * local;
          const cy = a.y + dy * local;
          const angle = Math.atan2(dy, dx);
          const half = padLength * 0.5;
          addSegment(
            cx - Math.cos(angle) * half,
            cy - Math.sin(angle) * half,
            cx + Math.cos(angle) * half,
            cy + Math.sin(angle) * half,
            'boost'
          );
          placed += 1;
          nextDistance += interval;
        }

        traveled += segLength;
      }
    }

    function makeLimb(a, b, stiffness = 0.72) {
      return Constraint.create({ bodyA: a, bodyB: b, stiffness, damping: 0.18, render: { visible: false } });
    }

    function spawnRider(x = state.camera.x + 220, y = state.camera.y + 80, color = '#2a83ff') {
      if (state.rider) removeRider();

      const group = Body.nextGroup(true);
      const bodyOptions = {
        collisionFilter: { group },
        friction: 0.78,
        frictionAir: 0.009,
        restitution: 0.05,
        density: 0.0012,
      };

      const head = Bodies.circle(x, y - 30, 10, { ...bodyOptions, label: 'riderHead' });
      const torso = Bodies.rectangle(x, y, 15, 34, { ...bodyOptions, label: 'riderTorso' });
      const hip = Bodies.circle(x, y + 24, 7, { ...bodyOptions, label: 'riderHip' });
      const lArm = Bodies.rectangle(x - 15, y + 2, 24, 5, { ...bodyOptions, label: 'riderLArm' });
      const rArm = Bodies.rectangle(x + 15, y + 2, 24, 5, { ...bodyOptions, label: 'riderRArm' });
      const lLeg = Bodies.rectangle(x - 10, y + 42, 28, 5, { ...bodyOptions, label: 'riderLLeg' });
      const rLeg = Bodies.rectangle(x + 12, y + 42, 28, 5, { ...bodyOptions, label: 'riderRLeg' });
      const board = Bodies.rectangle(x + 10, y + 58, 52, 7, {
        inertia: Infinity,
        collisionFilter: { group },
        friction: 0.16,
        frictionAir: 0.005,
        restitution: 0.02,
        density: 0.0025,
        chamfer: { radius: 4 },
        label: 'board'
      });

      const constraints = [
        makeLimb(head, torso, 0.55),
        makeLimb(torso, hip, 0.75),
        makeLimb(torso, lArm, 0.45),
        makeLimb(torso, rArm, 0.45),
        makeLimb(hip, lLeg, 0.62),
        makeLimb(hip, rLeg, 0.62),
        Constraint.create({ bodyA: lLeg, bodyB: board, pointA: { x: 12, y: 0 }, pointB: { x: -14, y: 0 }, stiffness: 0.8, damping: 0.15 }),
        Constraint.create({ bodyA: rLeg, bodyB: board, pointA: { x: 12, y: 0 }, pointB: { x: 16, y: 0 }, stiffness: 0.8, damping: 0.15 }),
      ];

      const parts = [head, torso, hip, lArm, rArm, lLeg, rLeg, board];
      World.add(world, [...parts, ...constraints]);

      state.rider = { parts, constraints, head, torso, hip, board, color, trail: [], groundedUntil: 0 };
      return state.rider;
    }

    function createStage() {
      const straightEndX = 30000;
      const straightY = 420;
      const curveSections = [
        { dx: 5200, dy: 220 },
        { dx: 4700, dy: 720 },
        { dx: 3900, dy: -280 },
        { dx: 5400, dy: 860 },
        { dx: 4300, dy: -320 },
        { dx: 6200, dy: 820 },
      ];

      addSegment(-300, straightY, straightEndX, straightY);
      const curvePoints = addSmoothCurve(straightEndX, straightY, curveSections);
      const stagePath = [
        { x: -300, y: straightY },
        { x: straightEndX, y: straightY },
        ...curvePoints.slice(1),
      ];

      addBoostPadsAlongPath(stagePath, {
        startOffset: 3200,
        interval: 3600,
        padLength: 220,
      });
    }

    function removeRider() {
      if (!state.rider) return;
      World.remove(world, state.rider.parts);
      World.remove(world, state.rider.constraints);
      state.rider = null;
    }

    function clearRiders() {
      removeRider();
    }

    function clearLines() {
      for (const body of state.staticBodies) World.remove(world, body);
      state.lines = [];
      state.boosts = [];
      state.staticBodies = [];
    }

    function resetAll() {
      clearRiders();
      clearLines();
      state.camera.x = state.camera.y = state.camera.targetX = state.camera.targetY = 0;
      state.camera.leadX = state.camera.leadY = 0;
      createStage();
      spawnRider(160, 90, '#2a83ff');
    }

    Events.on(engine, 'collisionStart', (event) => {
      for (const pair of event.pairs) {
        const labels = [pair.bodyA.label, pair.bodyB.label];
        if (labels.includes('boost')) {
          const riderBody = pair.bodyA.label === 'boost' ? pair.bodyB : pair.bodyA;
          if (!riderBody.isStatic) {
            state.stats.boostPower = Math.min(12, state.stats.boostPower + 5.5);
            Body.setVelocity(riderBody, { x: Math.max(riderBody.velocity.x, 18), y: riderBody.velocity.y - 1.8 });
            state.shake = Math.min(5, state.shake + 1.5);
          }
        }

        if (labels.includes('board') && (labels.includes('line') || labels.includes('boost'))) {
          if (state.rider) state.rider.groundedUntil = performance.now() + 180;
        }
      }
    });

    function updatePlayerControl() {
      const rider = state.rider;
      if (!rider) return;

      const board = rider.board;
      const grounded = performance.now() < rider.groundedUntil;

      const baseSpeed = 10;
      const boostDecay = 0.965;
      const maxBoostPower = 12;

      // D 키를 누르면 계속 가속
      if (state.keys.right) {
        state.stats.targetSpeed += 0.2;
      }

      // A 키를 누르면 감속
      if (state.keys.left) {
        state.stats.targetSpeed -= 0.24;
      }

      state.stats.targetSpeed = Math.max(baseSpeed, Math.min(72, state.stats.targetSpeed));

      state.stats.boostPower *= boostDecay;
      state.stats.boostPower = Math.max(0, Math.min(maxBoostPower, state.stats.boostPower));

      const targetSpeed = state.stats.targetSpeed + state.stats.boostPower;
      const currentSpeed = board.velocity.x;
      const lerpRate = grounded ? 0.22 : 0.09;
      const nextSpeed = currentSpeed + (targetSpeed - currentSpeed) * lerpRate;

      Body.setVelocity(board, {
        x: nextSpeed,
        y: board.velocity.y
      });

      Body.setAngularVelocity(board, 0);

      state.canJump = grounded;
      state.stats.speed = Math.hypot(board.velocity.x, board.velocity.y);
      state.stats.verticalSpeed = board.velocity.y;
      state.stats.grounded = grounded;

      if (state.jumpQueued && grounded) {
        Body.setVelocity(board, {
          x: board.velocity.x,
          y: -12
        });

        state.jumpQueued = false;
        rider.groundedUntil = 0;
        state.shake = 2;
      }
    }

    function updateStatsPanel() {
      document.getElementById('statSpeed').textContent = state.stats.speed.toFixed(1);
      document.getElementById('statTargetSpeed').textContent = state.stats.targetSpeed.toFixed(1);
      document.getElementById('statBoost').textContent = state.stats.boostPower.toFixed(1);
      document.getElementById('statVertical').textContent = state.stats.verticalSpeed.toFixed(1);
      document.getElementById('statGround').textContent = state.stats.grounded ? 'YES' : 'NO';
    }

    function updateCamera() {
      const main = state.rider;
      if (!main) return;
      const board = main.board;
      const speedFx = getSpeedIntensity();
      const speedStage = getSpeedStage();
      const stageLeadBoost = [0, 40, 90, 150][speedStage];
      const lookAhead = clamp(board.velocity.x * (9 + speedStage * 1.8), -120, innerWidth * 0.28 + speedFx * 140 + stageLeadBoost);
      const lookDown = clamp(Math.abs(board.velocity.x) * (0.18 + speedStage * 0.03) + Math.max(0, board.velocity.y) * 4, 0, 140);
      state.camera.leadX += (lookAhead - state.camera.leadX) * (0.14 + speedStage * 0.02);
      state.camera.leadY += (lookDown - state.camera.leadY) * 0.08;
      state.camera.targetX = board.position.x - innerWidth * (0.33 - speedFx * 0.08 - speedStage * 0.015) + state.camera.leadX;
      state.camera.targetY = board.position.y - innerHeight * 0.45 + state.camera.leadY;
      state.camera.x += (state.camera.targetX - state.camera.x) * (0.055 + speedFx * 0.035 + speedStage * 0.01);
      state.camera.y += (state.camera.targetY - state.camera.y) * (0.055 + speedFx * 0.02);
    }

    function drawGrid() {
      ctx.save();
      const speedFx = getSpeedIntensity();
      const speedStage = getSpeedStage();
      ctx.strokeStyle = `rgba(0,0,0,${0.045 + speedFx * 0.03})`;
      ctx.lineWidth = 1;
      const gap = 80 - speedFx * 16 - speedStage * 3;
      const startX = Math.floor(state.camera.x / gap) * gap;
      const startY = Math.floor(state.camera.y / gap) * gap;
      for (let x = startX; x < state.camera.x + innerWidth + gap; x += gap) {
        ctx.beginPath();
        ctx.moveTo(x - state.camera.x, 0);
        ctx.lineTo(x - state.camera.x, innerHeight);
        ctx.stroke();
      }
      for (let y = startY; y < state.camera.y + innerHeight + gap; y += gap) {
        ctx.beginPath();
        ctx.moveTo(0, y - state.camera.y);
        ctx.lineTo(innerWidth, y - state.camera.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawSpeedLines() {
      const rider = state.rider;
      if (!rider) return;

      const speedFx = getSpeedIntensity();
      const speedStage = getSpeedStage();
      if (speedStage === 0) return;

      const count = [0, 14, 24, 36][speedStage] + Math.floor(speedFx * 8);
      const length = [0, 36, 62, 96][speedStage] + speedFx * 26;
      const drift = (performance.now() * (0.45 + speedStage * 0.25 + speedFx * 0.9)) % 120;

      ctx.save();
      ctx.lineCap = 'round';

      for (let i = 0; i < count; i += 1) {
        const lane = ((i * 47) + drift * 7) % (innerHeight + 120);
        const y = lane - 60;
        const phase = ((i * 83) + drift * 17) % (innerWidth + 220);
        const startX = innerWidth - phase;
        const alpha = [0, 0.07, 0.11, 0.17][speedStage] * (1 - i / count);

        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 1 + speedStage * 0.7 + speedFx * 1.5;
        ctx.beginPath();
        ctx.moveTo(startX, y);
        ctx.lineTo(startX - length, y + rider.board.velocity.y * 0.08);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawSpeedVignette() {
      const speedFx = getSpeedIntensity();
      const speedStage = getSpeedStage();
      if (speedStage === 0) return;

      ctx.save();

      const edge = ctx.createLinearGradient(0, 0, innerWidth, 0);
      edge.addColorStop(0, `rgba(20, 30, 40, ${0.12 + speedStage * 0.07 + speedFx * 0.08})`);
      edge.addColorStop(0.18, 'rgba(20, 30, 40, 0)');
      edge.addColorStop(0.82, 'rgba(20, 30, 40, 0)');
      edge.addColorStop(1, `rgba(20, 30, 40, ${0.1 + speedStage * 0.06 + speedFx * 0.06})`);
      ctx.fillStyle = edge;
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      const glow = ctx.createRadialGradient(
        innerWidth * 0.72,
        innerHeight * 0.35,
        innerWidth * 0.08,
        innerWidth * 0.72,
        innerHeight * 0.35,
        innerWidth * 0.62
      );
      glow.addColorStop(0, `rgba(90, 210, 255, ${0.03 + speedStage * 0.025 + speedFx * 0.03})`);
      glow.addColorStop(1, 'rgba(90, 210, 255, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      if (speedStage >= 2) {
        const heat = ctx.createLinearGradient(0, innerHeight, 0, innerHeight * 0.25);
        heat.addColorStop(0, `rgba(255, 90, 90, ${0.05 + speedStage * 0.035})`);
        heat.addColorStop(1, 'rgba(255, 90, 90, 0)');
        ctx.fillStyle = heat;
        ctx.fillRect(0, 0, innerWidth, innerHeight);
      }

      ctx.restore();
    }

    function drawSegment(seg) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = seg.type === 'boost' ? '#111' : '#111';
      ctx.lineWidth = seg.type === 'boost' ? 9 : 5;
      ctx.beginPath();
      ctx.moveTo(seg.x1 - state.camera.x, seg.y1 - state.camera.y);
      ctx.lineTo(seg.x2 - state.camera.x, seg.y2 - state.camera.y);
      ctx.stroke();

      if (seg.type === 'boost') {
        ctx.strokeStyle = '#34a6ff';
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 10]);
        ctx.beginPath();
        ctx.moveTo(seg.x1 - state.camera.x, seg.y1 - state.camera.y - 8);
        ctx.lineTo(seg.x2 - state.camera.x, seg.y2 - state.camera.y - 8);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBodyLine(a, b, width = 4, color = '#111') {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.position.x - state.camera.x, a.position.y - state.camera.y);
      ctx.lineTo(b.position.x - state.camera.x, b.position.y - state.camera.y);
      ctx.stroke();
    }

    function drawRider(rider) {
      const accent = rider.color;
      const board = rider.board;
      const speedFx = getSpeedIntensity();
      const speedStage = getSpeedStage();
      const pulse = 0.82 + Math.sin(performance.now() * 0.018) * 0.18;

      rider.trail.push({ x: board.position.x, y: board.position.y });
      const maxTrail = Math.round(18 + speedFx * 18);
      if (rider.trail.length > maxTrail) rider.trail.shift();

      ctx.save();

      for (let i = 1; i < rider.trail.length; i++) {
        const p = rider.trail[i];
        const prev = rider.trail[i - 1];
        ctx.globalAlpha = (i / rider.trail.length) * (0.2 + speedFx * 0.26);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 6 + speedFx * 6;
        ctx.beginPath();
        ctx.moveTo(prev.x - state.camera.x, prev.y - state.camera.y);
        ctx.lineTo(p.x - state.camera.x, p.y - state.camera.y);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;

      // 실제 물리 충돌체는 얇은 보드이고, 캐릭터 큐브는 그 위에 얹힌 것처럼 그린다.
      // 큐브 하단이 라인 위에 자연스럽게 걸쳐 보이도록 추가 오프셋 적용
      const visualOffsetY = 17;
      ctx.translate(board.position.x - state.camera.x, board.position.y - state.camera.y - visualOffsetY);
      // 지오메트리 스타일처럼 큐브는 항상 정방향 유지
      ctx.rotate(0);

      const size = 34;

      ctx.shadowColor = accent;
      ctx.shadowBlur = 18 + speedFx * 18;

      ctx.fillStyle = accent;
      ctx.fillRect(-size / 2, -size / 2, size, size);

      ctx.shadowBlur = 0;

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#111';
      ctx.strokeRect(-size / 2, -size / 2, size, size);

      if (speedStage >= 2) {
        const trailLength = speedStage === 3 ? 16 + speedFx * 10 : 10 + speedFx * 6;
        const trailAlpha = speedStage === 3 ? 0.3 + pulse * 0.14 : 0.2 + speedFx * 0.08;
        const eyeTrail = ctx.createLinearGradient(4 - trailLength, 0, 11, 0);
        eyeTrail.addColorStop(0, 'rgba(255, 90, 90, 0)');
        eyeTrail.addColorStop(0.5, `rgba(255, 90, 90, ${trailAlpha * 0.45})`);
        eyeTrail.addColorStop(1, `rgba(255, 90, 90, ${trailAlpha})`);

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = eyeTrail;
        ctx.shadowColor = 'rgba(255, 90, 90, 0.9)';
        ctx.shadowBlur = speedStage === 3 ? 12 : 7;
        ctx.fillRect(4 - trailLength, -5, trailLength + 7, 5.5);
        ctx.restore();
      }

      ctx.fillStyle = speedStage >= 2
        ? `rgba(255, 90, 90, ${speedStage === 3 ? 0.82 + pulse * 0.18 : 0.78})`
        : '#fff';
      ctx.fillRect(4, -6, 7, 7);

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(-size / 2 + 4, -size / 2 + 4, size * 0.35, size * 0.35);

      ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function render() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const speedFx = getSpeedIntensity();
      const speedStage = getSpeedStage();
      const sky = ctx.createLinearGradient(0, 0, 0, innerHeight);
      sky.addColorStop(0, speedFx > 0.15 ? '#edf8ff' : '#f8f8f3');
      sky.addColorStop(1, speedFx > 0.15 ? '#f3f0e6' : '#f8f8f3');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      const motionShake = speedFx * Math.min(3.5 + speedStage * 0.6, Math.abs(state.stats.verticalSpeed) * 0.045 + speedStage * 0.25);
      const sx = (Math.random() - 0.5) * (state.shake + motionShake);
      const sy = (Math.random() - 0.5) * (state.shake * 0.8 + motionShake);
      state.shake *= 0.88;
      ctx.save();
      ctx.translate(sx, sy);
      const zoom = [1, 1.008, 1.018, 1.032][speedStage];
      ctx.translate(innerWidth / 2, innerHeight / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-innerWidth / 2, -innerHeight / 2);

      drawGrid();
      drawSpeedLines();
      [...state.lines, ...state.boosts].forEach(drawSegment);

      if (state.drawing && state.drawStart && state.drawEnd) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.strokeStyle = document.getElementById('toolSelect').value === 'boost' ? '#34a6ff' : 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 4;
        ctx.setLineDash([10, 7]);
        ctx.beginPath();
        ctx.moveTo(state.drawStart.x - state.camera.x, state.drawStart.y - state.camera.y);
        ctx.lineTo(state.drawEnd.x - state.camera.x, state.drawEnd.y - state.camera.y);
        ctx.stroke();
        ctx.restore();
      }

      if (state.rider) drawRider(state.rider);
      ctx.restore();
      drawSpeedVignette();
    }

    function loop(now) {
      const delta = Math.min(33.33, now - state.lastTime);
      state.lastTime = now;
      updatePlayerControl();
      const riderSpeed = state.rider ? Math.abs(state.rider.board.velocity.x) : 0;
      const substeps = clamp(
        Math.ceil(delta / 8.5) + (riderSpeed >= 60 ? 2 : riderSpeed >= 40 ? 1 : 0),
        1,
        6
      );
      const stepDelta = delta / substeps;
      for (let i = 0; i < substeps; i += 1) {
        Engine.update(engine, stepDelta);
      }
      updateCamera();
      updateStatsPanel();
      render();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('pointerdown', (e) => {
      state.drawing = true;
      state.drawStart = screenToWorld(e.clientX, e.clientY);
      state.drawEnd = {
        x: state.drawStart.x,
        y: state.drawStart.y
      };
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!state.drawing) return;
      const p = screenToWorld(e.clientX, e.clientY);
      if (e.shiftKey && state.drawStart) {
        const dx = p.x - state.drawStart.x;
        const dy = p.y - state.drawStart.y;
        if (Math.abs(dx) > Math.abs(dy)) p.y = state.drawStart.y;
        else p.x = state.drawStart.x;
      }
      state.drawEnd = p;
    });

    window.addEventListener('pointerup', () => {
      if (!state.drawing || !state.drawStart || !state.drawEnd) return;
      const type = document.getElementById('toolSelect').value;
      addSegment(state.drawStart.x, state.drawStart.y, state.drawEnd.x, state.drawEnd.y, type);
      state.drawing = false;
      state.drawStart = null;
      state.drawEnd = null;
    });

    document.getElementById('spawnBtn').addEventListener('click', () => spawnRider());
    document.getElementById('clearBtn').addEventListener('click', clearLines);
    document.getElementById('resetBtn').addEventListener('click', resetAll);

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'a' || e.key === 'ArrowLeft') state.keys.left = true;
      if (key === 'd' || e.key === 'ArrowRight') state.keys.right = true;
      if (key === 'w' || e.key === 'ArrowUp' || e.code === 'Space') {
        state.keys.jump = true;
        state.jumpQueued = true;
        e.preventDefault();
      }
      if (key === 'r') resetAll();
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'a' || e.key === 'ArrowLeft') state.keys.left = false;
      if (key === 'd' || e.key === 'ArrowRight') state.keys.right = false;
      if (key === 'w' || e.key === 'ArrowUp' || e.code === 'Space') state.keys.jump = false;
    });

    resetAll();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
