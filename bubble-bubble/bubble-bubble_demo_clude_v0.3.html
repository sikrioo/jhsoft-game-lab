<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BUBBLE ACTION — Demo</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#01050d;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:'Courier New',monospace;
}
#canvas-wrap canvas{
  display:block;
  max-width:100vw;
  max-height:100vh;
  object-fit:contain;
  image-rendering:auto;
}
#loading{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;background:#01050d;z-index:999;transition:opacity .5s;
}
#loading h1{
  font-size:clamp(24px,5vw,44px);
  letter-spacing:10px;color:#38bdf8;
  text-shadow:0 0 30px rgba(56,189,248,.6),0 0 60px rgba(56,189,248,.3);
  text-align:center;line-height:1.4;
}
.bar-wrap{width:220px;height:3px;background:#0d2a40;border-radius:2px;overflow:hidden}
.bar{height:100%;background:linear-gradient(90deg,#0ea5e9,#22d3ee,#a5f3fc);border-radius:2px;animation:ld 1.6s ease-out forwards}
@keyframes ld{from{width:0}to{width:100%}}
#loading p{font-size:11px;letter-spacing:3px;color:#1e4a6e;animation:blink 1.1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="loading">
  <h1>BUBBLE<br>ACTION</h1>
  <div class="bar-wrap"><div class="bar"></div></div>
  <p>LOADING...</p>
</div>
<div id="canvas-wrap"></div>
